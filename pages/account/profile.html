<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Profil akun Charvlibrary - lihat aktivitas, riwayat baca, dan kelola informasi akunmu.">
  <title>Profil Saya - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-8);
      align-items: start;
    }
    @media (max-width: 768px) { .profile-layout { grid-template-columns: 1fr; } }

    /* Sidebar profile */
    .profile-sidebar {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2xl);
      overflow: hidden;
      position: sticky;
      top: calc(var(--navbar-height) + var(--space-6));
    }

    .profile-sidebar-header {
      background: linear-gradient(135deg, var(--color-secondary) 0%, #6B2F0A 100%);
      padding: var(--space-8);
      text-align: center;
      position: relative;
    }

    .profile-avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: rgba(255,251,235,0.2);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      color: rgba(255,251,235,0.9);
      margin: 0 auto var(--space-4);
      border: 3px solid rgba(255,251,235,0.3);
    }

    .profile-name {
      font-family: var(--font-heading);
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      color: rgba(255,251,235,0.95);
      margin-bottom: var(--space-1);
    }

    .profile-email {
      font-size: var(--font-size-sm);
      color: rgba(255,251,235,0.6);
    }

    .profile-member-since {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-size-xs);
      color: rgba(255,251,235,0.5);
      margin-top: var(--space-3);
    }

    /* Nav menu sidebar */
    .profile-nav { padding: var(--space-4) 0; }

    .profile-nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-5);
      text-decoration: none;
      color: var(--color-foreground);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      transition: background var(--transition-fast), color var(--transition-fast);
      border-left: 3px solid transparent;
    }
    .profile-nav-item:hover { background: var(--color-muted); }
    .profile-nav-item.active {
      background: var(--color-accent-light);
      color: var(--color-secondary);
      border-left-color: var(--color-secondary);
    }
    .profile-nav-divider {
      height: 1px;
      background: var(--color-border);
      margin: var(--space-2) var(--space-4);
    }

    /* Main area */
    .profile-main {}

    /* Stats buku */
    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    @media (max-width: 480px) { .profile-stats { grid-template-columns: 1fr; } }

    .profile-stat-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      text-align: center;
    }
    .profile-stat-num {
      font-family: var(--font-heading);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-secondary);
      display: block;
    }
    .profile-stat-label {
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
      margin-top: var(--space-1);
    }

    /* Recent activity */
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .activity-item {
      display: flex;
      gap: var(--space-4);
      padding: var(--space-4);
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
    }

    .activity-icon {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .activity-text { flex: 1; }
    .activity-title { font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }
    .activity-time  { font-size: var(--font-size-xs); color: var(--color-muted-foreground); margin-top: 2px; }

    .section-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2xl);
      padding: var(--space-6);
      margin-bottom: var(--space-6);
    }
    .section-card-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-5);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
