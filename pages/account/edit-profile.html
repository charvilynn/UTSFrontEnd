<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edit informasi profil akunmu di Charvlibrary.">
  <title>Edit Profil - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .edit-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--space-8);
      align-items: start;
    }
    @media (max-width: 768px) { .edit-layout { grid-template-columns: 1fr; } }

    /* Avatar section */
    .avatar-picker-section {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      text-align: center;
      position: sticky;
      top: calc(var(--navbar-height) + var(--space-4));
    }
    .avatar-preview {
      width: 100px; height: 100px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading);
      font-size: 40px;
      font-weight: var(--font-weight-semibold);
      color: white;
      margin: 0 auto var(--space-5);
      transition: background var(--transition-base);
    }
    .avatar-colors {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }
    .avatar-color-swatch {
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform var(--transition-fast), border-color var(--transition-fast);
    }
    .avatar-color-swatch:hover { transform: scale(1.15); }
    .avatar-color-swatch.active { border-color: var(--color-foreground); transform: scale(1.1); }
    .avatar-color-label { font-size: var(--font-size-xs); color: var(--color-muted-foreground); }

    /* Form section */
    .form-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-7);
    }
    .form-card h2 {
      font-family: var(--font-heading);
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--color-border);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }

    .char-counter {
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
      text-align: right;
      margin-top: 4px;
    }
    .char-counter.near-limit { color: var(--color-accent); }
    .char-counter.at-limit   { color: var(--color-error); }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="../../index.html" class="navbar-brand">
        <svg class="navbar-logo-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="#92400E"/>
          <path d="M10 28V10h12l4 4v14H10z" fill="#FFFBEB" opacity="0.9"/>
          <path d="M22 10v4h4" fill="none" stroke="#92400E" stroke-width="1.5"/>
        </svg>
        <span class="navbar-brand-name">Charvlibrary</span>
      </a>
      <div style="margin-left:auto; display:flex; gap:var(--space-3);">
        <a href="profile.html" class="btn btn-ghost btn-sm">← Batal</a>
      </div>
    </div>
  </header>

  <div class="navbar-spacer"></div>

  <main>
    <div class="section--sm">
      <div class="container">
        <nav aria-label="Breadcrumb" class="breadcrumb" style="margin-bottom:var(--space-6);">
          <a href="../../index.html">Beranda</a>
          <span class="breadcrumb-sep" aria-hidden="true">/</span>
          <a href="profile.html">Profil</a>
          <span class="breadcrumb-sep" aria-hidden="true">/</span>
          <span aria-current="page">Edit Profil</span>
        </nav>

        <h1 style="font-family:var(--font-heading); font-size:var(--font-size-3xl); font-weight:var(--font-weight-light); margin-bottom:var(--space-7);">Edit Profil</h1>

        <div class="edit-layout">
          <!-- Avatar sidebar -->
          <aside>
            <div class="avatar-picker-section fade-up">
              <div class="avatar-preview" id="avatarPreview">D</div>
              <p style="font-weight:var(--font-weight-semibold); margin-bottom:var(--space-2);" id="avatarName">Nama Pengguna</p>
              <p class="avatar-color-label" style="margin-bottom:var(--space-3);">Pilih warna avatar:</p>
              <div class="avatar-colors" id="avatarColors" role="radiogroup" aria-label="Warna avatar">
                <!-- diisi JS -->
              </div>
              <p class="avatar-color-label">Inisial menyesuaikan nama yang kamu masukkan</p>
            </div>
          </aside>

          <!-- Form -->
          <div>
            <form id="editProfileForm" novalidate>
              <!-- Info pribadi -->
              <div class="form-card fade-up" style="margin-bottom:var(--space-5);">
                <h2>Informasi Pribadi</h2>

                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label" for="editFirstName">Nama Depan <span class="required">*</span></label>
                    <input type="text" id="editFirstName" class="form-input" placeholder="Nama depan" required aria-describedby="firstNameErr">
                    <p class="form-error-msg" id="firstNameErr" role="alert"></p>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="editLastName">Nama Belakang</label>
                    <input type="text" id="editLastName" class="form-input" placeholder="Nama belakang (opsional)">
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label" for="editEmail">Email <span class="required">*</span></label>
                  <input type="email" id="editEmail" class="form-input" placeholder="nama@email.com" required aria-describedby="emailErr">
                  <p class="form-error-msg" id="emailErr" role="alert"></p>
                </div>

                <div class="form-group">
                  <label class="form-label" for="editBio">Bio <span style="font-weight:normal; color:var(--color-muted-foreground);">(opsional)</span></label>
                  <textarea
                    id="editBio"
                    class="form-input"
                    rows="3"
                    placeholder="Ceritakan sedikit tentang dirimu sebagai pembaca..."
                    maxlength="200"
                    style="resize:vertical;"
                    aria-describedby="bioCounter"
                  ></textarea>
                  <p class="char-counter" id="bioCounter" aria-live="polite"><span id="bioCount">0</span>/200</p>
                </div>
              </div>

              <!-- Password section -->
              <div class="form-card fade-up" style="margin-bottom:var(--space-5);">
                <h2>Ganti Password</h2>
                <p style="font-size:var(--font-size-sm); color:var(--color-muted-foreground); margin-bottom:var(--space-5);">Biarkan kosong jika tidak ingin mengubah password.</p>

                <div class="form-group">
                  <label class="form-label" for="currentPassword">Password Saat Ini</label>
                  <input type="password" id="currentPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label" for="newPassword">Password Baru</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="••••••••" autocomplete="new-password" aria-describedby="newPassErr">
                    <p class="form-error-msg" id="newPassErr" role="alert"></p>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="confirmPassword">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" autocomplete="new-password" aria-describedby="confirmPassErr">
                    <p class="form-error-msg" id="confirmPassErr" role="alert"></p>
                  </div>
                </div>
              </div>

              <!-- Actions -->
              <div style="display:flex; justify-content:flex-end; gap:var(--space-3);">
                <a href="profile.html" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary" id="saveBtn">
                  Simpan Perubahan
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../../assets/js/data-books.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/nav.js"></script>
  <script>
    const avatarColors = [
      '#92400E','#065F46','#1E40AF','#5B21B6','#991B1B','#0F766E'
    ];
    let selectedColor = avatarColors[0];

    document.addEventListener('DOMContentLoaded', () => {
      const user = getUser() || { name: 'Pengguna', email: '', bio: '', avatarColor: avatarColors[0] };
      const [firstName, ...rest] = (user.name || '').split(' ');

      // Prefill form
      document.getElementById('editFirstName').value = firstName || '';
      document.getElementById('editLastName').value  = rest.join(' ') || '';
      document.getElementById('editEmail').value     = user.email || '';
      document.getElementById('editBio').value       = user.bio || '';

      selectedColor = user.avatarColor || avatarColors[0];

      // Render avatar colors
      const colorsEl = document.getElementById('avatarColors');
      colorsEl.innerHTML = avatarColors.map(c => `
        <button
          type="button"
          class="avatar-color-swatch${c === selectedColor ? ' active' : ''}"
          style="background:${c};"
          data-color="${c}"
          aria-label="Pilih warna avatar"
          aria-pressed="${c === selectedColor}"
        ></button>
      `).join('');

      updateAvatarPreview(firstName || 'U', selectedColor);
      document.getElementById('avatarName').textContent = user.name || 'Nama Pengguna';

      // Color picker
      colorsEl.addEventListener('click', e => {
        const swatch = e.target.closest('.avatar-color-swatch');
        if (!swatch) return;
        selectedColor = swatch.dataset.color;
        document.querySelectorAll('.avatar-color-swatch').forEach(s => {
          s.classList.toggle('active', s.dataset.color === selectedColor);
          s.setAttribute('aria-pressed', s.dataset.color === selectedColor);
        });
        const fname = document.getElementById('editFirstName').value || 'U';
        updateAvatarPreview(fname, selectedColor);
      });

      // Live avatar update on name change
      document.getElementById('editFirstName').addEventListener('input', e => {
        const val = e.target.value || 'U';
        updateAvatarPreview(val, selectedColor);
        document.getElementById('avatarName').textContent =
          `${val} ${document.getElementById('editLastName').value}`.trim() || 'Nama Pengguna';
      });
      document.getElementById('editLastName').addEventListener('input', () => {
        const fn = document.getElementById('editFirstName').value || 'U';
        const ln = document.getElementById('editLastName').value;
        document.getElementById('avatarName').textContent = `${fn} ${ln}`.trim() || 'Nama Pengguna';
      });

      // Bio counter
      const bioField = document.getElementById('editBio');
      const bioCount = document.getElementById('bioCount');
      const bioCounter = document.getElementById('bioCounter');
      bioField.addEventListener('input', () => {
        const len = bioField.value.length;
        bioCount.textContent = len;
        bioCounter.className = 'char-counter' + (len >= 200 ? ' at-limit' : len >= 160 ? ' near-limit' : '');
      });
      bioCount.textContent = bioField.value.length;

      // Form submit
      document.getElementById('editProfileForm').addEventListener('submit', e => {
        e.preventDefault();
        let valid = true;

        const fn = document.getElementById('editFirstName').value.trim();
        const em = document.getElementById('editEmail').value.trim();
        const np = document.getElementById('newPassword').value;
        const cp = document.getElementById('confirmPassword').value;

        const fnErr = document.getElementById('firstNameErr');
        const emErr = document.getElementById('emailErr');
        const npErr = document.getElementById('newPassErr');
        const cpErr = document.getElementById('confirmPassErr');

        if (!fn) {
          fnErr.textContent = 'Nama depan wajib diisi'; fnErr.classList.add('visible');
          document.getElementById('editFirstName').classList.add('error');
          valid = false;
        } else { fnErr.textContent = ''; fnErr.classList.remove('visible'); document.getElementById('editFirstName').classList.remove('error'); }

        if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) {
          emErr.textContent = 'Email valid wajib diisi'; emErr.classList.add('visible');
          document.getElementById('editEmail').classList.add('error');
          valid = false;
        } else { emErr.textContent = ''; emErr.classList.remove('visible'); document.getElementById('editEmail').classList.remove('error'); }

        if (np && np.length < 6) {
          npErr.textContent = 'Password minimal 6 karakter'; npErr.classList.add('visible');
          valid = false;
        } else { npErr.textContent = ''; npErr.classList.remove('visible'); }

        if (np && np !== cp) {
          cpErr.textContent = 'Password tidak cocok'; cpErr.classList.add('visible');
          valid = false;
        } else { cpErr.textContent = ''; cpErr.classList.remove('visible'); }

        if (!valid) return;

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Menyimpan...';

        const ln = document.getElementById('editLastName').value.trim();
        const bio = document.getElementById('editBio').value.trim();
        const updatedUser = { name: `${fn} ${ln}`.trim(), email: em, bio, avatarColor: selectedColor };

        setTimeout(() => {
          saveUser(updatedUser);
          showToast('Profil berhasil diperbarui!', 'success');
          setTimeout(() => { window.location.href = 'profile.html'; }, 800);
        }, 900);
      });

      initScrollReveal();
    });

    function updateAvatarPreview(name, color) {
      const el = document.getElementById('avatarPreview');
      el.style.background = color;
      el.textContent = name.charAt(0).toUpperCase();
    }
  </script>
</body>
</html>
