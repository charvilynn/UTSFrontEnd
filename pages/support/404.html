<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Halaman tidak ditemukan - Charvlibrary.">
  <title>404 - Halaman Tidak Ditemukan - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8);
      background: var(--color-background);
    }

    .nf-illustration {
      position: relative;
      width: 280px; height: 280px;
      margin: 0 auto var(--space-8);
    }

    .nf-404 {
      font-family: var(--font-heading);
      font-size: 140px;
      font-weight: var(--font-weight-bold);
      color: var(--color-border);
      letter-spacing: -8px;
      line-height: 1;
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      user-select: none;
    }

    .nf-book {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      animation: float404 3s ease-in-out infinite;
    }

    @keyframes float404 {
      0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(-3deg); }
      50%       { transform: translate(-50%, -50%) translateY(-16px) rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) { .nf-book { animation: none; } }

    .nf-title {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 3vw, var(--font-size-3xl));
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-3);
    }
    .nf-desc {
      color: var(--color-muted-foreground);
      font-size: var(--font-size-lg);
      max-width: 40ch;
      margin: 0 auto var(--space-8);
      line-height: var(--line-height-relaxed);
    }
    .nf-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-10);
    }

    .nf-search-wrap {
      max-width: 400px;
      width: 100%;
      margin: 0 auto var(--space-6);
      position: relative;
    }
    .nf-search-icon {
      position: absolute;
      left: var(--space-4);
      top: 50%; transform: translateY(-50%);
      color: var(--color-muted-foreground);
    }
    .nf-search-input {
      width: 100%;
      padding: var(--space-3) var(--space-4) var(--space-3) 44px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      font-size: var(--font-size-base);
      background: var(--color-card);
      color: var(--color-foreground);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .nf-search-input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }
    
    .nf-links {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      justify-content: center;
    }
    .nf-link {
      padding: var(--space-1) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      font-size: var(--font-size-sm);
      text-decoration: none;
      color: var(--color-foreground);
      transition: all var(--transition-fast);
    }
    .nf-link:hover {
      border-color: var(--color-secondary);
      color: var(--color-secondary);
      background: var(--color-accent-light);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="../../index.html" class="navbar-brand">
        <svg class="navbar-logo-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="#92400E"/>
          <path d="M10 28V10h12l4 4v14H10z" fill="#FFFBEB" opacity="0.9"/>
          <path d="M22 10v4h4" fill="none" stroke="#92400E" stroke-width="1.5"/>
        </svg>
        <span class="navbar-brand-name">Charvlibrary</span>
      </a>
    </div>
  </header>

  <main>
    <div class="not-found-page">

      <div class="nf-illustration" aria-hidden="true">
        <p class="nf-404">404</p>
        <div class="nf-book">
          <svg width="100" height="120" viewBox="0 0 100 120" fill="none">
            <rect x="10" y="10" width="80" height="100" rx="6" fill="#FFFBEB" stroke="#92400E" stroke-width="2"/>
            <rect x="10" y="10" width="14" height="100" rx="6" fill="#92400E"/>
            <line x1="34" y1="38" x2="74" y2="38" stroke="#E5C99A" stroke-width="2"/>
            <line x1="34" y1="50" x2="74" y2="50" stroke="#E5C99A" stroke-width="2"/>
            <line x1="34" y1="62" x2="60" y2="62" stroke="#E5C99A" stroke-width="2"/>
            <text x="42" y="90" font-family="serif" font-size="32" fill="#92400E" opacity="0.5">?</text>
          </svg>
        </div>
      </div>

      <h1 class="nf-title">Halaman Tidak Ditemukan</h1>
      <p class="nf-desc">
        Sepertinya kamu tersesat di antara rak-rak buku kami. Halaman yang kamu cari tidak ada atau sudah dipindahkan.
      </p>

      <div class="nf-search-wrap">
        <svg class="nf-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input
          type="search"
          id="nfSearchInput"
          class="nf-search-input"
          placeholder="Cari buku atau halaman..."
          aria-label="Cari di Charvlibrary"
        >
      </div>

      <div class="nf-actions">
        <a href="../../index.html" class="btn btn-primary btn-lg">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Ke Beranda
        </a>
        <a href="../discovery/explore.html" class="btn btn-secondary btn-lg">Jelajahi Buku</a>
      </div>

      <div>
        <p style="font-size:var(--font-size-sm);color:var(--color-muted-foreground);margin-bottom:var(--space-3);">Atau kunjungi:</p>
        <nav aria-label="Halaman populer" class="nf-links">
          <a href="../discovery/explore.html" class="nf-link">📚 Semua Buku</a>
          <a href="../library/wishlist.html" class="nf-link">❤️ Wishlist</a>
          <a href="../account/my-borrowed-books.html" class="nf-link">📖 Pinjaman</a>
          <a href="../community/faq.html" class="nf-link">❓ FAQ</a>
          <a href="../support/contact.html" class="nf-link">✉️ Kontak</a>
        </nav>
      </div>

    </div>
  </main>

  <script src="../../assets/js/data-books.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const reason = params.get('reason');
      const from   = params.get('from');

      if (reason) {
        const desc = document.querySelector('.nf-desc');
        if (desc) {
          const reasonEl = document.createElement('p');
          reasonEl.style.cssText = `
            margin-top: 12px;
            font-size: var(--font-size-sm);
            color: var(--color-secondary);
            background: var(--color-accent-light, #FEF3C7);
            border: 1px solid #F59E0B;
            border-radius: 8px;
            padding: 10px 16px;
            display: inline-block;
          `;
          reasonEl.textContent = reason;
          desc.insertAdjacentElement('afterend', reasonEl);
        }
      }

      if (from && window.history.length > 1) {
        const actions = document.querySelector('.nf-actions');
        if (actions) {
          const backBtn = document.createElement('button');
          backBtn.className = 'btn btn-ghost btn-lg';
          backBtn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Kembali
          `;
          backBtn.addEventListener('click', () => window.history.back());
          actions.prepend(backBtn);
        }
      }
    })();

    document.getElementById('nfSearchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const q = e.target.value.trim();
        if (q) {
          window.location.href = `../discovery/search-results.html?q=${encodeURIComponent(q)}`;
        }
      }
    });
  </script>
</body>
</html>
