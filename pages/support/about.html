  <style>
    /* Hero about */
    .about-hero {
      background: linear-gradient(135deg, var(--color-secondary) 0%, #5B1E08 100%);
      padding-block: var(--space-20) var(--space-16);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .about-hero::before {
      content: '';
      position: absolute;
      top: -100px; right: -100px;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }
    .about-hero::after {
      content: '';
      position: absolute;
      bottom: -80px; left: -80px;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }
    .about-hero-content { position: relative; z-index: 1; }
    .about-hero h1 {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 6vw, var(--font-size-6xl));
      font-weight: var(--font-weight-light);
      color: rgba(255,251,235,0.95);
      letter-spacing: -0.03em;
      margin-bottom: var(--space-5);
    }
    .about-hero p {
      font-size: var(--font-size-xl);
      color: rgba(255,251,235,0.65);
      max-width: 50ch;
      margin-inline: auto;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-1);
      background: var(--color-border);
      border-radius: var(--radius-2xl);
      overflow: hidden;
      margin-bottom: var(--space-16);
    }
    @media (max-width: 640px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

    .stat-item {
      background: var(--color-card);
      padding: var(--space-8);
      text-align: center;
    }
    .stat-num {
      font-family: var(--font-heading);
      font-size: var(--font-size-5xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-secondary);
      line-height: 1;
      margin-bottom: var(--space-2);
      display: block;
    }
    .stat-label {
      font-size: var(--font-size-sm);
      color: var(--color-muted-foreground);
    }

    /* Mission */
    .about-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-16);
      align-items: center;
      margin-bottom: var(--space-20);
    }
    @media (max-width: 768px) { .about-two-col { grid-template-columns: 1fr; } }

    .about-section-label {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-widest);
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: var(--space-3);
    }
    .about-section-heading {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 3vw, var(--font-size-4xl));
      font-weight: var(--font-weight-light);
      line-height: 1.2;
      margin-bottom: var(--space-5);
    }

    /* Tim */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: var(--space-5);
    }
    @media (max-width: 1024px) { .team-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px)  { .team-grid { grid-template-columns: repeat(2, 1fr); } }

    .team-card {
      text-align: center;
      padding: var(--space-5);
      background: var(--color-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }
    .team-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .team-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      color: white;
      margin: 0 auto var(--space-4);
    }

    .team-name {
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-1);
    }
    .team-role {
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
    }

    /* Values */
    .values-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-6);
    }
    @media (max-width: 768px) { .values-grid { grid-template-columns: 1fr; } }

    .value-item {
      padding: var(--space-6);
      background: var(--color-muted);
      border-radius: var(--radius-xl);
      border-left: 3px solid var(--color-accent);
    }
    .value-icon { margin-bottom: var(--space-4); color: var(--color-accent); }
    .value-title { font-family: var(--font-heading); font-size: var(--font-size-xl); margin-bottom: var(--space-2); }
  </style>
</head>
