<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel administrasi Charvlibrary - kelola buku, pengguna, dan peminjaman.">
  <title>Admin Panel - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    body { display: flex; min-height: 100vh; }

    .admin-sidebar {
      width: 240px;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: var(--space-6) var(--space-4);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 768px) { .admin-sidebar { display: none; } }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-8);
      text-decoration: none;
    }
    .admin-brand-name { font-family: var(--font-heading); font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); color: var(--color-foreground); }
    .admin-brand-badge {
      font-size: var(--font-size-xs);
      background: var(--color-accent);
      color: white;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: var(--font-weight-semibold);
    }

    .admin-nav-group-label {
      font-size: var(--font-size-xs);
      letter-spacing: var(--letter-spacing-wider);
      text-transform: uppercase;
      color: var(--color-muted-foreground);
      font-weight: var(--font-weight-semibold);
      padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-1);
    }
    .admin-nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-foreground);
      width: 100%;
      text-align: left;
      transition: background var(--transition-fast), color var(--transition-fast);
      margin-bottom: 2px;
    }
    .admin-nav-item:hover { background: var(--color-muted); }
    .admin-nav-item.active { background: var(--color-accent-light); color: var(--color-secondary); font-weight: var(--font-weight-semibold); }
    .admin-nav-icon { flex-shrink: 0; }

    .admin-main {
      flex: 1;
      padding: var(--space-6) var(--space-8);
      overflow-y: auto;
    }
    @media (max-width: 768px) { .admin-main { padding: var(--space-4); } }

    .admin-page-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-6);
    }

    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }
    .admin-stat-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      transition: box-shadow var(--transition-base);
    }
    .admin-stat-card:hover { box-shadow: var(--shadow-md); }
    .admin-stat-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: var(--space-3);
      font-size: 22px;
    }
    .admin-stat-val {
      font-family: var(--font-heading);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-secondary);
      line-height: 1;
    }
    .admin-stat-label { font-size: var(--font-size-sm); color: var(--color-muted-foreground); margin-top: 4px; }
    .admin-stat-change {
      font-size: var(--font-size-xs);
      margin-top: var(--space-1);
      font-weight: var(--font-weight-semibold);
    }
    .admin-stat-change.up   { color: #10B981; }
    .admin-stat-change.down { color: #EF4444; }

    .admin-table-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: var(--space-6);
    }
    .admin-table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--color-border);
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .admin-table-title { font-weight: var(--font-weight-semibold); }
    table { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); }
    th { padding: var(--space-3) var(--space-4); text-align: left; font-weight: var(--font-weight-semibold); color: var(--color-muted-foreground); font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--color-border); background: var(--color-muted); }
    td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--color-muted); }

    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
  </style>
</head>
<body>

  <div id="adminLoginGate" style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--color-background);" hidden>
    <div style="max-width:380px;width:100%;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-2xl);padding:var(--space-8);">
      <h1 style="font-family:var(--font-heading);font-size:var(--font-size-2xl);margin-bottom:var(--space-6);">Admin Login</h1>
      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminUser">Username</label>
          <input type="text" id="adminUser" class="form-input" placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="adminPass">Password</label>
          <input type="password" id="adminPass" class="form-input" placeholder="••••••" autocomplete="current-password">
        </div>
        <p id="adminLoginErr" style="color:var(--color-error);font-size:var(--font-size-sm);margin-bottom:var(--space-4);display:none;"></p>
        <button type="submit" class="btn btn-primary" style="width:100%;">Masuk sebagai Admin</button>
      </form>
    </div>
  </div>

  <div id="adminApp" style="display:none;flex:1;">
    <aside class="admin-sidebar" aria-label="Navigasi admin">
      <a href="../../index.html" class="admin-brand">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="#92400E"/>
          <path d="M10 28V10h12l4 4v14H10z" fill="#FFFBEB" opacity="0.9"/>
        </svg>
        <span class="admin-brand-name">Charvlibrary</span>
        <span class="admin-brand-badge">Admin</span>
      </a>

      <p class="admin-nav-group-label">Overview</p>
      <button class="admin-nav-item active" data-panel="dashboard" onclick="switchPanel(this, 'dashboard')">
        <svg class="admin-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>

      <p class="admin-nav-group-label" style="margin-top:var(--space-4);">Manajemen</p>
      <button class="admin-nav-item" data-panel="books" onclick="switchPanel(this, 'books')">
        <svg class="admin-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Buku
      </button>
      <button class="admin-nav-item" data-panel="users" onclick="switchPanel(this, 'users')">
        <svg class="admin-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Pengguna
      </button>
      <button class="admin-nav-item" data-panel="borrows" onclick="switchPanel(this, 'borrows')">
        <svg class="admin-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Peminjaman
      </button>

      <div style="margin-top:auto;padding-top:var(--space-4);border-top:1px solid var(--color-border);">
        <button class="admin-nav-item" onclick="adminLogout()">
          <svg class="admin-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Keluar
        </button>
      </div>
    </aside>

    <main class="admin-main">

      <div id="panel-dashboard" class="admin-panel active">
        <h1 class="admin-page-title">Dashboard</h1>

        <div class="admin-stats-grid" id="adminStats">
        </div>

        <div class="admin-table-card">
          <div class="admin-table-header">
            <p class="admin-table-title">Buku Terpopuler</p>
            <button class="btn btn-ghost btn-sm" onclick="switchPanel(document.querySelector('[data-panel=books]'), 'books')">Lihat Semua →</button>
          </div>
          <table aria-label="Buku terpopuler">
            <thead>
              <tr>
                <th>Judul</th>
                <th>Author</th>
                <th>Genre</th>
                <th>Rating</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="popularBooksTable"></tbody>
          </table>
        </div>
      </div>

      <div id="panel-books" class="admin-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6);">
          <h1 class="admin-page-title" style="margin:0;">Manajemen Buku</h1>
          <button class="btn btn-primary btn-sm" onclick="showToast('Fitur tambah buku akan datang!', 'info')">+ Tambah Buku</button>
        </div>

        <div style="margin-bottom:var(--space-4);">
          <input type="search" id="bookSearch" class="form-input" placeholder="Cari judul atau penulis..." style="max-width:320px;" aria-label="Cari buku">
        </div>

        <div class="admin-table-card">
          <table aria-label="Daftar semua buku">
            <thead>
              <tr>
                <th>ID</th>
                <th>Judul</th>
                <th>Author</th>
                <th>Genre</th>
                <th>Rating</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="allBooksTable"></tbody>
          </table>
        </div>
      </div>

      <div id="panel-users" class="admin-panel">
        <h1 class="admin-page-title">Manajemen Pengguna</h1>
        <div class="admin-table-card">
          <table aria-label="Daftar pengguna">
            <thead><tr><th>#</th><th>Nama</th><th>Email</th><th>Bergabung</th><th>Status</th></tr></thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div>
      </div>

      <div id="panel-borrows" class="admin-panel">
        <h1 class="admin-page-title">Peminjaman Aktif</h1>
        <div class="admin-table-card">
          <table aria-label="Daftar peminjaman aktif">
            <thead><tr><th>Pengguna</th><th>Buku</th><th>Tanggal Pinjam</th><th>Jatuh Tempo</th><th>Status</th></tr></thead>
            <tbody id="borrowsTable"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="../../assets/js/data-books.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script>
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'Charvlibrary2024';

    function checkAdminAuth() {
      const authed = sessionStorage.getItem('Charvlibrary_admin_authed');
      if (authed) {
        showAdmin();
      } else {
        document.getElementById('adminLoginGate').hidden = false;
        document.getElementById('adminApp').style.display = 'none';
      }
    }

    function showAdmin() {
      document.getElementById('adminLoginGate').hidden = true;
      document.getElementById('adminApp').style.display = 'flex';
      populateAdmin();
    }

    document.getElementById('adminLoginForm').addEventListener('submit', e => {
      e.preventDefault();
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value;
      const errEl = document.getElementById('adminLoginErr');

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('Charvlibrary_admin_authed', '1');
        showAdmin();
      } else {
        errEl.textContent = 'Username atau password salah';
        errEl.style.display = 'block';
      }
    });

    function adminLogout() {
      sessionStorage.removeItem('Charvlibrary_admin_authed');
      window.location.reload();
    }

    function switchPanel(btn, panelId) {
      document.querySelectorAll('.admin-nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${panelId}`).classList.add('active');
    }

    function populateAdmin() {
      const books = booksData || [];

      document.getElementById('adminStats').innerHTML = [
        { icon: '📚', label: 'Total Buku', val: books.length, change: '+2 bulan ini', dir: 'up', bg: '#FFFBEB' },
        { icon: '👥', label: 'Pengguna Aktif', val: 128, change: '+12 minggu ini', dir: 'up', bg: '#EFF6FF' },
        { icon: '📖', label: 'Dipinjam', val: 43, change: '-3 dari kemarin', dir: 'down', bg: '#F0FDF4' },
        { icon: '⚠️', label: 'Terlambat', val: 5, change: '+2 hari ini', dir: 'down', bg: '#FFF7ED' },
      ].map(s => `
        <div class="admin-stat-card">
          <div class="admin-stat-icon" style="background:${s.bg};">${s.icon}</div>
          <p class="admin-stat-val">${s.val}</p>
          <p class="admin-stat-label">${s.label}</p>
          <p class="admin-stat-change ${s.dir}">${s.change}</p>
        </div>
      `).join('');

      const popular = [...books].sort((a, b) => b.rating - a.rating).slice(0, 5);
      document.getElementById('popularBooksTable').innerHTML = popular.map(b => `
        <tr>
          <td style="font-weight:var(--font-weight-medium);">${b.title}</td>
          <td>${b.author}</td>
          <td><span class="badge badge--genre">${b.genre}</span></td>
          <td>⭐ ${b.rating || '4.0'}</td>
          <td><span class="badge badge--available">Tersedia</span></td>
        </tr>
      `).join('');

      let displayBooks = [...books];
      function renderBooksTable(list) {
        document.getElementById('allBooksTable').innerHTML = list.map(b => `
          <tr>
            <td style="color:var(--color-muted-foreground);">#${b.id}</td>
            <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.title}</td>
            <td>${b.author}</td>
            <td>${b.genre}</td>
            <td>⭐ ${b.rating || '4.0'}</td>
            <td><span class="badge badge--available">Tersedia</span></td>
            <td>
              <button class="btn btn-ghost btn-sm" onclick="showToast('Edit: ${b.title.replace(/'/g, '')}', 'info')">Edit</button>
            </td>
          </tr>
        `).join('');
      }
      renderBooksTable(displayBooks);

      document.getElementById('bookSearch').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        renderBooksTable(books.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)));
      });

      const mockUsers = [
        { name: 'Chandra Widjaja', email: 'chandra@uni.ac.id', joined: '2026-09-01' },
        { name: 'Aaron Pratama',   email: 'aaron@uni.ac.id',   joined: '2026-09-01' },
        { name: 'Davvin',   email: 'Davvin@uni.ac.id',   joined: '2026-09-02' },
        { name: 'Olivian Reza',    email: 'olivian@uni.ac.id', joined: '2026-09-02' },
        { name: 'Livi Hartono',    email: 'livi@uni.ac.id',    joined: '2026-09-03' },
      ];
      document.getElementById('usersTable').innerHTML = mockUsers.map((u, i) => `
        <tr>
          <td>${i + 1}</td>
          <td style="font-weight:var(--font-weight-medium);">${u.name}</td>
          <td>${u.email}</td>
          <td>${formatDate(u.joined)}</td>
          <td><span class="badge badge--available">Aktif</span></td>
        </tr>
      `).join('');

      const mockBorrows = books.slice(0, 5).map((b, i) => ({
        user: mockUsers[i % mockUsers.length].name,
        bookTitle: b.title,
        borrowDate: '2026-09-20',
        returnDate: '2026-10-04',
        late: i === 1,
      }));
      document.getElementById('borrowsTable').innerHTML = mockBorrows.map(br => `
        <tr>
          <td>${br.user}</td>
          <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${br.bookTitle}</td>
          <td>${formatDate(br.borrowDate)}</td>
          <td>${formatDate(br.returnDate)}</td>
          <td>${br.late ? '<span class="badge" style="background:rgba(239,68,68,0.1);color:#B91C1C;">Terlambat</span>' : '<span class="badge badge--borrow">Aktif</span>'}</td>
        </tr>
      `).join('');
    }

    checkAdminAuth();
  </script>
</body>
</html>
