<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Beri ulasan dan baca review buku di Charvlibrary.">
  <title>Ulasan Buku - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .reviews-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--space-8);
      align-items: start;
    }
    @media (max-width: 900px) { .reviews-layout { grid-template-columns: 1fr; } }

    /* Book header */
    .book-review-header {
      display: flex;
      gap: var(--space-5);
      padding: var(--space-6);
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      margin-bottom: var(--space-7);
    }
    .book-review-cover {
      width: 80px; height: 112px;
      object-fit: cover;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
    }
    .book-review-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-1);
    }
    .book-review-meta { color: var(--color-muted-foreground); font-size: var(--font-size-sm); margin-bottom: var(--space-3); }

    /* Star rating input */
    .star-rating-input {
      display: flex;
      gap: var(--space-1);
      margin-bottom: var(--space-2);
    }
    .star-btn {
      background: none; border: none;
      font-size: 32px;
      cursor: pointer;
      color: var(--color-border);
      transition: color var(--transition-fast), transform var(--transition-fast);
      padding: 4px;
      line-height: 1;
    }
    .star-btn:hover,
    .star-btn.active  { color: #F59E0B; }
    .star-btn:hover   { transform: scale(1.2); }

    .star-label {
      font-size: var(--font-size-sm);
      color: var(--color-muted-foreground);
      min-height: 20px;
      margin-bottom: var(--space-4);
    }

    /* Review form card */
    .review-form-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      margin-bottom: var(--space-8);
    }
    .review-form-card h2 {
      font-family: var(--font-heading);
      font-size: var(--font-size-xl);
      margin-bottom: var(--space-5);
    }

    .review-char-counter {
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
      text-align: right;
      margin-top: 4px;
    }

    /* Review list items */
    .review-item {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
    }
    .review-item-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .review-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-base);
      color: white;
      flex-shrink: 0;
    }
    .reviewer-name  { font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); }
    .reviewer-date  { font-size: var(--font-size-xs); color: var(--color-muted-foreground); }
    .review-stars   { color: #F59E0B; letter-spacing: 1px; font-size: 15px; }
    .review-text    { font-size: var(--font-size-sm); line-height: var(--line-height-relaxed); color: var(--color-foreground); }

    /* Sidebar: rating summary */
    .rating-summary-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      position: sticky;
      top: calc(var(--navbar-height) + var(--space-4));
    }
    .big-rating {
      font-family: var(--font-heading);
      font-size: 64px;
      font-weight: var(--font-weight-bold);
      color: var(--color-secondary);
      line-height: 1;
      text-align: center;
    }
    .rating-stars-display {
      text-align: center;
      font-size: 24px;
      color: #F59E0B;
      margin-bottom: var(--space-1);
    }
    .rating-count { text-align: center; font-size: var(--font-size-sm); color: var(--color-muted-foreground); margin-bottom: var(--space-5); }

    .rating-bar-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
      font-size: var(--font-size-xs);
    }
    .rating-bar-label { width: 16px; text-align: right; color: var(--color-muted-foreground); }
    .rating-bar-track { flex: 1; height: 6px; background: var(--color-border); border-radius: var(--radius-full); overflow: hidden; }
    .rating-bar-fill  { height: 100%; background: #F59E0B; border-radius: var(--radius-full); transition: width .6s var(--ease-out); }
    .rating-bar-count { width: 20px; color: var(--color-muted-foreground); }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="../../index.html" class="navbar-brand">
        <svg class="navbar-logo-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="#92400E"/>
          <path d="M10 28V10h12l4 4v14H10z" fill="#FFFBEB" opacity="0.9"/>
          <path d="M22 10v4h4" fill="none" stroke="#92400E" stroke-width="1.5"/>
        </svg>
        <span class="navbar-brand-name">Charvlibrary</span>
      </a>
      <nav aria-label="Navigasi utama">
        <ul class="navbar-nav">
          <li><a href="../../index.html">Beranda</a></li>
          <li><a href="../discovery/explore.html">Jelajahi</a></li>
        </ul>
      </nav>
      <button class="navbar-toggle" aria-expanded="false" aria-label="Buka menu"><span></span><span></span><span></span></button>
    </div>
  </header>
  <div class="navbar-spacer"></div>

  <div id="notFoundState" class="empty-state" hidden>
    <p class="empty-state-title">Buku tidak ditemukan</p>
    <a href="../discovery/explore.html" class="btn btn-primary">Kembali ke Jelajahi</a>
  </div>

  <main id="mainContent" hidden>
    <section class="section--sm">
      <div class="container">
        <nav aria-label="Breadcrumb" class="breadcrumb" style="margin-bottom:var(--space-6);">
          <a href="../../index.html">Beranda</a>
          <span class="breadcrumb-sep">/</span>
          <a href="../discovery/explore.html">Jelajahi</a>
          <span class="breadcrumb-sep">/</span>
          <span aria-current="page" id="breadcrumbTitle">Ulasan</span>
        </nav>

        <!-- Book header -->
        <div class="book-review-header fade-up" id="bookHeader">
          <!-- diisi JS -->
        </div>

        <div class="reviews-layout">
          <!-- Left: form + list -->
          <div>
            <!-- Form tulis review -->
            <div class="review-form-card fade-up">
              <h2>Tulis Ulasanmu</h2>

              <div class="star-rating-input" id="starInput" role="group" aria-label="Beri rating bintang">
                <button class="star-btn" data-val="1" aria-label="1 bintang" type="button">★</button>
                <button class="star-btn" data-val="2" aria-label="2 bintang" type="button">★</button>
                <button class="star-btn" data-val="3" aria-label="3 bintang" type="button">★</button>
                <button class="star-btn" data-val="4" aria-label="4 bintang" type="button">★</button>
                <button class="star-btn" data-val="5" aria-label="5 bintang" type="button">★</button>
              </div>
              <p class="star-label" id="starLabel">Klik bintang untuk memberi rating</p>

              <form id="reviewForm" novalidate>
                <div class="form-group">
                  <label class="form-label" for="reviewText">Ulasan <span class="required">*</span></label>
                  <textarea
                    id="reviewText"
                    class="form-input"
                    rows="4"
                    placeholder="Bagaimana pendapatmu tentang buku ini? Ceritakan pengalamanmu..."
                    maxlength="500"
                    style="resize:vertical;"
                    aria-describedby="reviewCharCounter reviewTextErr"
                    required
                  ></textarea>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                    <p class="form-error-msg" id="reviewTextErr" role="alert"></p>
                    <p class="review-char-counter"><span id="reviewCharCount">0</span>/500</p>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitReviewBtn">
                  Publikasikan Ulasan
                </button>
              </form>
            </div>

            <!-- List ulasan -->
            <div id="reviewsList">
              <!-- diisi JS -->
            </div>
          </div>

          <!-- Right: rating summary -->
          <aside>
            <div class="rating-summary-card fade-up" id="ratingSummary">
              <!-- diisi JS -->
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <script src="../../assets/js/data-books.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/nav.js"></script>
  <script>
    const starLabels = ['', 'Mengecewakan', 'Kurang bagus', 'Cukup bagus', 'Bagus sekali', 'Luar biasa!'];
    const avatarColors = ['#92400E', '#065F46', '#1E40AF', '#5B21B6', '#991B1B', '#0F766E'];


    const defaultReviews = [
      { id: 1, name: 'Rizki M.', rating: 5, text: 'Buku yang sangat berkesan. Narasi mengalir dan karakternya terasa nyata.', date: '2026-09-10', color: '#065F46' },
      { id: 2, name: 'Sari A.',  rating: 4, text: 'Sangat direkomendasikan! Tapi ada beberapa bagian yang agak lambat.', date: '2026-09-05', color: '#1E40AF' },
      { id: 3, name: 'Budi P.',  rating: 5, text: 'Salah satu buku terbaik yang pernah saya baca tahun ini.', date: '2026-08-28', color: '#5B21B6' },
    ];

    let currentRating = 0;
    let bookId;
    let reviews;

    document.addEventListener('DOMContentLoaded', () => {
      bookId = parseInt(getUrlParam('id'));
      const book = getBookById(bookId);

      if (!book) {
        document.getElementById('notFoundState').hidden = false;
        return;
      }

      document.title = `Ulasan: ${book.title} - Charvlibrary`;
      document.getElementById('mainContent').hidden = false;
      document.getElementById('breadcrumbTitle').textContent = `Ulasan: ${truncateText(book.title, 25)}`;


      document.getElementById('bookHeader').innerHTML = `
        <img src="${book.coverFallback || book.cover}" alt="Sampul ${book.title}" class="book-review-cover" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400&q=80';">
        <div>
          <h1 class="book-review-title">${book.title}</h1>
          <p class="book-review-meta">oleh ${book.author} &middot; ${book.genre}</p>
          <div style="display:flex; align-items:center; gap:var(--space-2);">
            <span style="color:#F59E0B; font-size:18px;">${renderStars(book.rating || 4)}</span>
            <span style="font-size:var(--font-size-sm); color:var(--color-muted-foreground);">${book.rating || 4}/5</span>
          </div>
          <div style="margin-top:var(--space-3); display:flex; gap:var(--space-2);">
            <a href="../discovery/book-detail.html?id=${book.id}" class="btn btn-ghost btn-sm">← Detail Buku</a>
            <a href="borrow-checkout.html?id=${book.id}" class="btn btn-secondary btn-sm">Pinjam Buku</a>
          </div>
        </div>
      `;


      reviews = getFromStorage(`Charvlibrary_reviews_${bookId}`, defaultReviews);

      renderRatingSummary();
      renderReviewsList();


      const starBtns = document.querySelectorAll('.star-btn');
      starBtns.forEach(btn => {
        btn.addEventListener('mouseover', () => highlightStars(parseInt(btn.dataset.val)));
        btn.addEventListener('focus',     () => highlightStars(parseInt(btn.dataset.val)));
        btn.addEventListener('mouseleave',() => highlightStars(currentRating));
        btn.addEventListener('click', () => {
          currentRating = parseInt(btn.dataset.val);
          highlightStars(currentRating);
          document.getElementById('starLabel').textContent = starLabels[currentRating];
        });
      });


      document.getElementById('reviewText').addEventListener('input', e => {
        document.getElementById('reviewCharCount').textContent = e.target.value.length;
      });


      document.getElementById('reviewForm').addEventListener('submit', e => {
        e.preventDefault();
        const textEl = document.getElementById('reviewText');
        const errEl  = document.getElementById('reviewTextErr');
        let valid = true;

        if (currentRating === 0) {
          document.getElementById('starLabel').textContent = '⚠ Pilih rating terlebih dahulu';
          document.getElementById('starLabel').style.color = 'var(--color-error)';
          valid = false;
        }
        if (!textEl.value.trim()) {
          errEl.textContent = 'Ulasan tidak boleh kosong';
          errEl.classList.add('visible');
          textEl.classList.add('error');
          valid = false;
        } else {
          errEl.textContent = ''; errEl.classList.remove('visible'); textEl.classList.remove('error');
        }
        if (!valid) return;

        const user = getUser();
        const newReview = {
          id: Date.now(),
          name: user?.name || 'Kamu',
          rating: currentRating,
          text: textEl.value.trim(),
          date: new Date().toISOString().split('T')[0],
          color: avatarColors[Math.floor(Math.random() * avatarColors.length)],
          isNew: true,
        };

        const submitBtn = document.getElementById('submitReviewBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Mengirim...';

        setTimeout(() => {
          reviews = [newReview, ...reviews];
          saveToStorage(`Charvlibrary_reviews_${bookId}`, reviews);
          renderRatingSummary();
          renderReviewsList();
          textEl.value = ''; document.getElementById('reviewCharCount').textContent = '0';
          currentRating = 0; highlightStars(0);
          document.getElementById('starLabel').textContent = 'Klik bintang untuk memberi rating';
          document.getElementById('starLabel').style.color = '';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Publikasikan Ulasan';
          showToast('Ulasan berhasil dipublikasikan!', 'success');
        }, 700);
      });

      initScrollReveal();
    });

    function highlightStars(val) {
      document.querySelectorAll('.star-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i < val);
      });
    }

    function renderStars(rating) {
      return '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating));
    }

    function renderRatingSummary() {
      const avg = reviews.reduce((s, r) => s + r.rating, 0) / (reviews.length || 1);
      const counts = [0, 0, 0, 0, 0];
      reviews.forEach(r => { if (r.rating >= 1 && r.rating <= 5) counts[r.rating - 1]++; });

      document.getElementById('ratingSummary').innerHTML = `
        <p class="big-rating">${avg.toFixed(1)}</p>
        <p class="rating-stars-display">${renderStars(avg)}</p>
        <p class="rating-count">${reviews.length} ulasan</p>
        ${[5,4,3,2,1].map(n => `
          <div class="rating-bar-row">
            <span class="rating-bar-label">${n}</span>
            <div class="rating-bar-track">
              <div class="rating-bar-fill" style="width:${reviews.length ? (counts[n-1]/reviews.length*100) : 0}%;"></div>
            </div>
            <span class="rating-bar-count">${counts[n-1]}</span>
          </div>
        `).join('')}
      `;
    }

    function renderReviewsList() {
      const list = document.getElementById('reviewsList');
      if (reviews.length === 0) {
        list.innerHTML = `<div class="empty-state" style="background:var(--color-muted);border-radius:var(--radius-xl);"><p class="empty-state-title">Belum ada ulasan</p><p class="empty-state-desc">Jadilah yang pertama mengulas buku ini!</p></div>`;
        return;
      }
      list.innerHTML = reviews.map(r => `
        <div class="review-item fade-up${r.isNew ? ' new-review' : ''}">
          <div class="review-item-header">
            <div class="review-avatar" style="background:${r.color || '#92400E'};">${r.name.charAt(0).toUpperCase()}</div>
            <div>
              <p class="reviewer-name">${r.name}</p>
              <p class="reviewer-date">${formatDate(r.date)}</p>
            </div>
            <span class="review-stars" style="margin-left:auto;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>
          </div>
          <p class="review-text">${r.text}</p>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
