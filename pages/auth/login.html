<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masuk ke akun Charvlibrary untuk meminjam dan mengelola buku favoritmu.">
  <title>Masuk - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    .auth-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - var(--navbar-height));
    }
    @media (max-width: 768px) { .auth-layout { grid-template-columns: 1fr; } }

    /* Panel kiri - ilustrasi/brand */
    .auth-visual {
      background: linear-gradient(145deg, var(--color-secondary) 0%, #6B2F0A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12);
      position: relative;
      overflow: hidden;
    }
    @media (max-width: 768px) { .auth-visual { display: none; } }

    .auth-visual-quote {
      font-family: var(--font-heading);
      font-size: var(--font-size-3xl);
      font-style: italic;
      font-weight: var(--font-weight-light);
      color: rgba(255, 251, 235, 0.9);
      text-align: center;
      line-height: 1.35;
      max-width: 32ch;
      position: relative;
      z-index: 1;
    }
    .auth-visual-attr {
      margin-top: var(--space-6);
      font-size: var(--font-size-base);
      color: rgba(255, 251, 235, 0.55);
      position: relative;
      z-index: 1;
    }

    /* Decorative circles */
    .auth-visual::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: rgba(255, 251, 235, 0.06);
    }
    .auth-visual::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -60px;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: rgba(255, 251, 235, 0.04);
    }

    /* Panel kanan - form */
    .auth-form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-8);
      background: var(--color-background);
    }

    .auth-form-wrap {
      width: 100%;
      max-width: 400px;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      text-decoration: none;
      margin-bottom: var(--space-8);
    }
    .auth-logo-name {
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-secondary);
    }

    .auth-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-light);
      margin-bottom: var(--space-2);
    }
    .auth-subtitle {
      color: var(--color-muted-foreground);
      margin-bottom: var(--space-8);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    /* password toggle */
    .input-with-toggle {
      position: relative;
    }
    .input-with-toggle .form-input {
      padding-right: var(--space-12);
    }
    .password-toggle {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-muted-foreground);
      padding: var(--space-2);
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }
    .password-toggle:hover { color: var(--color-foreground); }

    .auth-forgot {
      font-size: var(--font-size-sm);
      color: var(--color-accent);
      text-align: right;
      text-decoration: none;
    }
    .auth-forgot:hover { text-decoration: underline; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      color: var(--color-muted-foreground);
      font-size: var(--font-size-sm);
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .auth-switch {
      text-align: center;
      font-size: var(--font-size-sm);
      color: var(--color-muted-foreground);
      margin-top: var(--space-4);
    }
    .auth-switch a { color: var(--color-secondary); font-weight: var(--font-weight-semibold); }

    /* Success feedback setelah login */
    .auth-success {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-4);
    }
    .auth-success-icon {
      width: 64px; height: 64px;
      background: var(--color-success-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-success);
    }
  </style>
</head>
