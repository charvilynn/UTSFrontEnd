<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset password akun Charvlibrary kamu lewat email.">
  <title>Lupa Password - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    .auth-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - var(--navbar-height));
    }
    @media (max-width: 768px) { .auth-layout { grid-template-columns: 1fr; } }

    .auth-visual {
      background: linear-gradient(145deg, #065F46 0%, #064E3B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12);
      position: relative;
      overflow: hidden;
    }
    @media (max-width: 768px) { .auth-visual { display: none; } }
    .auth-visual::before {
      content: '';
      position: absolute; top: -80px; right: -80px;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }
    .auth-visual::after {
      content: '';
      position: absolute; bottom: -60px; left: -60px;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }
    .auth-visual-content { position: relative; z-index: 1; text-align: center; }
    .auth-visual-icon {
      width: 96px; height: 96px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-6);
      color: rgba(255,255,255,0.9);
    }
    .auth-visual-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      color: rgba(255,255,255,0.9);
      font-weight: var(--font-weight-light);
      margin-bottom: var(--space-3);
    }
    .auth-visual-desc {
      font-size: var(--font-size-base);
      color: rgba(255,255,255,0.55);
      max-width: 30ch;
    }

    .auth-form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-8);
      background: var(--color-background);
    }
    .auth-form-wrap { width: 100%; max-width: 400px; }

    .auth-logo {
      display: flex; align-items: center; gap: var(--space-2);
      text-decoration: none; margin-bottom: var(--space-8);
    }
    .auth-logo-name {
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-secondary);
    }

    .auth-title { font-family: var(--font-heading); font-size: var(--font-size-3xl); font-weight: var(--font-weight-light); margin-bottom: var(--space-2); }
    .auth-subtitle { color: var(--color-muted-foreground); margin-bottom: var(--space-8); line-height: var(--line-height-relaxed); }

    /* Success state */
    .sent-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-4);
      padding: var(--space-6);
      background: var(--color-muted);
      border-radius: var(--radius-xl);
    }
    .sent-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #10B981, #059669);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: popIn .5s cubic-bezier(.34, 1.56, .64, 1) forwards;
      color: white;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .sent-icon { animation: none; } }

    .resend-area {
      margin-top: var(--space-4);
      font-size: var(--font-size-sm);
      color: var(--color-muted-foreground);
    }
    .resend-btn {
      background: none; border: none; cursor: pointer;
      color: var(--color-secondary);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      padding: 0;
    }
    .resend-btn:disabled { color: var(--color-muted-foreground); cursor: default; }
  </style>
</head>

        </p>

    <div class="auth-form-panel">
