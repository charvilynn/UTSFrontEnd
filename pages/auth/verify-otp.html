<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masukkan kode verifikasi yang dikirimkan ke emailmu.">
  <title>Verifikasi OTP - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); }

    .verify-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
    }

    .verify-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2xl);
      padding: var(--space-10) var(--space-8);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .verify-icon-wrap {
      width: 72px; height: 72px;
      background: var(--color-accent-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-5);
      color: var(--color-accent);
    }

    .verify-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-light);
      margin-bottom: var(--space-2);
    }
    .verify-subtitle {
      color: var(--color-muted-foreground);
      font-size: var(--font-size-base);
      margin-bottom: var(--space-8);
    }
    .verify-email-highlight {
      font-weight: var(--font-weight-semibold);
      color: var(--color-foreground);
    }

    /* OTP inputs */
    .otp-group {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      margin-bottom: var(--space-8);
    }

    .otp-input {
      width: 64px; height: 72px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-lg);
      font-size: var(--font-size-3xl);
      font-family: var(--font-heading);
      font-weight: var(--font-weight-bold);
      text-align: center;
      background: var(--color-background);
      color: var(--color-foreground);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
      outline: none;
      caret-color: var(--color-accent);
    }
