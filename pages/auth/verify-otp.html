<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masukkan kode verifikasi yang dikirimkan ke emailmu.">
  <title>Verifikasi Kode OTP - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); }

    .verify-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
    }

    .verify-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2xl);
      padding: var(--space-10) var(--space-8);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .verify-icon-wrap {
      width: 72px; height: 72px;
      background: var(--color-accent-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-5);
      color: var(--color-accent);
    }

    .verify-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-light);
      margin-bottom: var(--space-2);
    }
    .verify-subtitle {
      color: var(--color-muted-foreground);
      font-size: var(--font-size-base);
      margin-bottom: var(--space-8);
    }
    .verify-email-highlight {
      font-weight: var(--font-weight-semibold);
      color: var(--color-foreground);
      word-break: break-all;
    }

    /* OTP inputs */
    .otp-group {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      margin-bottom: var(--space-8);
    }

    .otp-input {
      width: 64px; height: 72px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-lg);
      font-size: var(--font-size-3xl);
      font-family: var(--font-heading);
      font-weight: var(--font-weight-bold);
      text-align: center;
      background: var(--color-background);
      color: var(--color-foreground);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
      outline: none;
      caret-color: var(--color-accent);
    }
    .otp-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
      transform: translateY(-2px);
    }
    .otp-input.filled {
      border-color: var(--color-secondary);
      background: var(--color-accent-light);
    }
    .otp-input.error {
      border-color: var(--color-error);
      animation: shake .3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Timer */
    .otp-timer {
      font-size: var(--font-size-sm);
      color: var(--color-muted-foreground);
      margin-bottom: var(--space-5);
    }
    .otp-resend {
      background: none; border: none; cursor: pointer;
      color: var(--color-secondary); font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-sm); padding: 0;
    }
    .otp-resend:disabled { color: var(--color-muted-foreground); cursor: default; }

    /* Success overlay */
    .verify-success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
    }
    .verify-success-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #10B981, #059669);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: popIn .5s cubic-bezier(.34, 1.56, .64, 1) forwards;
      color: white;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .verify-success-icon { animation: none; }
      .otp-input { transition: none; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="../../index.html" class="navbar-brand">
        <svg class="navbar-logo-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="#92400E"/>
          <path d="M10 28V10h12l4 4v14H10z" fill="#FFFBEB" opacity="0.9"/>
          <path d="M22 10v4h4" fill="none" stroke="#92400E" stroke-width="1.5"/>
        </svg>
        <span class="navbar-brand-name">Charvlibrary</span>
      </a>
      <div style="margin-left:auto;">
        <a href="forgot-password.html" class="btn btn-ghost btn-sm" id="btnBack">← Kembali</a>
      </div>
    </div>
  </header>

  <div class="navbar-spacer"></div>

  <div class="verify-page">
    <div class="verify-card">

      <div id="verifyFormState">
        <div class="verify-icon-wrap" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>

        <h1 class="verify-title">Cek Email Kamu</h1>
        <p class="verify-subtitle">
          Kami kirim kode 4 digit ke<br>
          <span class="verify-email-highlight" id="targetEmail">email@kamu.com</span>
        </p>

        <div class="otp-group" role="group" aria-label="Masukkan kode OTP 4 digit">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" id="otp-0" aria-label="Digit pertama" autocomplete="one-time-code">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" id="otp-1" aria-label="Digit kedua">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" id="otp-2" aria-label="Digit ketiga">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" id="otp-3" aria-label="Digit keempat">
        </div>

        <p class="otp-timer" id="otpTimer" aria-live="polite">
          Kirim ulang kode dalam <strong id="otpCountdown">120</strong> detik
        </p>
        <button class="otp-resend" id="resendOtp" disabled>Kirim Ulang Kode</button>

        <button class="btn btn-primary" id="verifyBtn" style="width:100%; margin-top:var(--space-6);" disabled>
          Verifikasi
        </button>

        <p id="otpError" style="color:var(--color-error); font-size:var(--font-size-sm); margin-top:var(--space-3); display:none;" role="alert">
          Kode tidak valid. Coba lagi.
        </p>

        <p style="margin-top:var(--space-5); font-size:var(--font-size-sm); color:var(--color-muted-foreground);">
          <strong>Demo:</strong> Masukkan kode apapun (4 digit) untuk melanjutkan.
        </p>
      </div>

      <div class="verify-success" id="verifySuccess" aria-live="polite">
        <div class="verify-success-icon" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <p style="font-family:var(--font-heading); font-size:var(--font-size-2xl);" id="successTitle">Terverifikasi!</p>
        <p style="color:var(--color-muted-foreground);" id="successDesc">Akunmu sudah aktif. Mengalihkan...</p>
      </div>

    </div>
  </div>

  <script src="../../assets/js/data-books.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const inputs     = [...document.querySelectorAll('.otp-input')];
      const verifyBtn  = document.getElementById('verifyBtn');
      const resendBtn  = document.getElementById('resendOtp');
      const timerEl    = document.getElementById('otpTimer');
      const countdown  = document.getElementById('otpCountdown');
      const btnBack    = document.getElementById('btnBack');

      const urlParams  = new URLSearchParams(location.search);
      const emailParam = urlParams.get('email') || 'email@kamu.com';
      const fromParam  = urlParams.get('from');

      document.getElementById('targetEmail').textContent = emailParam;

      if (btnBack) {
        if (fromParam === 'forgot') {
          btnBack.href = 'forgot-password.html';
        } else {
          btnBack.href = 'register.html';
        }
      }

      inputs.forEach((input, i) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/\D/g, '');
          e.target.value = val;
          e.target.classList.toggle('filled', val !== '');
          if (val && i < 3) inputs[i + 1].focus();
          checkAllFilled();
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && i > 0) {
            inputs[i - 1].focus();
            inputs[i - 1].value = '';
            inputs[i - 1].classList.remove('filled');
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
          pasted.split('').forEach((ch, j) => {
            if (inputs[j]) {
              inputs[j].value = ch;
              inputs[j].classList.add('filled');
            }
          });
          inputs[Math.min(pasted.length, 3)].focus();
          checkAllFilled();
        });
      });

      function checkAllFilled() {
        const filled = inputs.every(inp => inp.value.length === 1);
        verifyBtn.disabled = !filled;
      }

      verifyBtn.addEventListener('click', () => {
        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Memverifikasi...';
        document.getElementById('otpError').style.display = 'none';

        setTimeout(() => {
          document.getElementById('verifyFormState').style.display = 'none';
          const successEl = document.getElementById('verifySuccess');
          successEl.style.display = 'flex';

          const titleEl = document.getElementById('successTitle');
          const descEl  = document.getElementById('successDesc');

          if (fromParam === 'forgot') {
            titleEl.textContent = 'Verifikasi Berhasil!';
            descEl.textContent = 'Kode OTP terverifikasi. Mengalihkan ke halaman masuk...';
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1500);
          } else {
            titleEl.textContent = 'Terverifikasi!';
            descEl.textContent = 'Akunmu sudah aktif. Mengalihkan ke onboarding...';
            setTimeout(() => {
              window.location.href = 'onboarding.html';
            }, 1500);
          }
        }, 1000);
      });

      let sec = 120;
      const timer = setInterval(() => {
        sec--;
        countdown.textContent = sec;
        if (sec <= 0) {
          clearInterval(timer);
          timerEl.style.display = 'none';
          resendBtn.disabled = false;
        }
      }, 1000);

      resendBtn.addEventListener('click', () => {
        inputs.forEach(inp => { inp.value = ''; inp.classList.remove('filled', 'error'); });
        verifyBtn.disabled = true;
        resendBtn.disabled = true;
        sec = 120;
        countdown.textContent = sec;
        timerEl.style.display = 'block';

        const newTimer = setInterval(() => {
          sec--;
          countdown.textContent = sec;
          if (sec <= 0) {
            clearInterval(newTimer);
            timerEl.style.display = 'none';
            resendBtn.disabled = false;
          }
        }, 1000);

        inputs[0].focus();
      });

      inputs[0].focus();
    });
  </script>
</body>
</html>
