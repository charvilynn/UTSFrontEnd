<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buat akun Charvlibrary baru.">
  <title>Daftar - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
  <main id="main-content">
    <section class="auth-section">
      <h1>Buat Akun</h1>
      <form id="registerForm">
        <input type="text" id="fullName" placeholder="Nama Lengkap" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Kata Sandi" required>
        <input type="password" id="confirmPassword" placeholder="Konfirmasi Kata Sandi" required>
        <button type="submit" class="btn btn-primary">Daftar</button>
      </form>
      <p>Sudah punya akun? <a href="login.html">Masuk</a></p>
    </section>
  </main>
  <script src="../../assets/js/data-books.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/nav.js"></script>
</body>
</html>
