<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Artikel dan tulisan seputar dunia buku di Charvlibrary.">
  <title>Artikel - Charvlibrary</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    /* Reading progress bar */
    .reading-progress {
      position: fixed;
      top: var(--navbar-height);
      left: 0; right: 0;
      height: 3px;
      background: var(--color-border);
      z-index: 200;
    }
    .reading-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-secondary), var(--color-accent));
      width: 0%;
      transition: width .1s linear;
    }

    /* Article layout */
    .article-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: var(--space-10);
      align-items: start;
    }
    @media (max-width: 900px) { .article-layout { grid-template-columns: 1fr; } }

    /* Article header */
    .article-category {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-wider);
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: var(--space-3);
    }
    .article-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: var(--font-weight-light);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-4);
    }
    .article-meta {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-8);
      padding-bottom: var(--space-6);
      border-bottom: 1px solid var(--color-border);
      font-size: var(--font-size-sm);
      color: var(--color-muted-foreground);
    }
    .author-chip {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .author-avatar-sm {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      color: white;
      flex-shrink: 0;
    }

    /* Article body */
    .article-body {
      font-size: var(--font-size-lg);
      line-height: 2;
      color: var(--color-foreground);
    }
    .article-body p { margin-bottom: var(--space-6); }
    .article-body h2 {
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      margin-top: var(--space-10);
      margin-bottom: var(--space-4);
    }
    .article-body h3 {
      font-family: var(--font-heading);
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      margin-top: var(--space-8);
      margin-bottom: var(--space-3);
    }
    .article-body blockquote {
      border-left: 4px solid var(--color-accent);
      padding: var(--space-4) var(--space-6);
      margin: var(--space-8) 0;
      background: var(--color-accent-light);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-style: italic;
    }
    .article-body ul { padding-left: var(--space-6); margin-bottom: var(--space-6); }
    .article-body li { margin-bottom: var(--space-2); }

    /* Sidebar */
    .article-sidebar {
      position: sticky;
      top: calc(var(--navbar-height) + var(--space-6));
    }
    .sidebar-widget {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
    }
    .sidebar-widget-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-border);
    }

    /* Related articles */
    .related-article-item {
      display: flex;
      gap: var(--space-3);
      padding-block: var(--space-3);
      border-bottom: 1px solid var(--color-border);
      text-decoration: none;
      color: inherit;
      transition: background var(--transition-fast);
      border-radius: var(--radius-sm);
    }
    .related-article-item:last-child { border-bottom: none; }
    .related-article-item:hover { color: var(--color-secondary); }
    .related-article-thumb {
      width: 56px; height: 56px;
      border-radius: var(--radius-md);
      object-fit: cover;
      flex-shrink: 0;
    }
    .related-article-title { font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); line-height: 1.4; }

    /* Tags */
    .article-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-8);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-border);
    }
  </style>
</head>
<body>

  <div class="reading-progress">
    <div class="reading-progress-fill" id="readingProgressFill"></div>
  </div>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="../../index.html" class="navbar-brand">
        <svg class="navbar-logo-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
